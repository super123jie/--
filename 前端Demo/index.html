<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HomeCare-Agent · 智能家居 Demo</title>

  <!-- Tailwind CDN（开发用，生产请打包） -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 + ReactDOM via esm.sh，并通过 import map 暴露给 type=module -->
  <script type="importmap">
  {
    "imports": {
      "react":           "https://esm.sh/react@18.3.1",
      "react-dom":       "https://esm.sh/react-dom@18.3.1",
      "react-dom/client":"https://esm.sh/react-dom@18.3.1/client",
      "framer-motion":   "https://esm.sh/framer-motion@11.11.10?deps=react@18.3.1",
      "lucide-react":    "https://esm.sh/lucide-react@0.469.0?deps=react@18.3.1"
    }
  }
  </script>

  <!-- Babel standalone：把内联 JSX 转成 JS -->
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

  <style>
    html, body, #root { height: 100%; }
    body { margin: 0; background: #0b1020; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft Yahei", sans-serif; }
    /* 滚动条美化 */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(6,182,212,.3); border-radius: 4px; }
    ::-webkit-scrollbar-track { background: rgba(15,23,42,.4); }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- 用 type=module + data-type=module 让 Babel 把 JSX 转码后保留 ES Module 语义 -->
  <script type="text/babel" data-type="module" data-presets="env,react"
          src="./SmartHomeDemo.jsx"></script>

  <!-- 引导：等 Babel 编译完后挂载到 #root -->
  <script type="text/babel" data-type="module" data-presets="env,react">
    import React from "react";
    import { createRoot } from "react-dom/client";
    import SmartHomeDemo from "./SmartHomeDemo.jsx";

    createRoot(document.getElementById("root")).render(
      React.createElement(SmartHomeDemo)
    );
  </script>
</body>
</html>
